[package]
name = "fearless-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
io-uring = ["dep:io-uring", "dep:core_affinity"]

[dependencies]
arc-swap = "1.7"
httpdate = "1"
libc = "0.2"
memchr = "2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
smallvec = "1"
core_affinity = { version = "0.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
