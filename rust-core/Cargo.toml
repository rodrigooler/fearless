[package]
name = "fearless-core"
version = "0.1.0"
edition = "2021"

[dependencies]
httpdate = "1"
libc = "0.2"
memchr = "2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
smallvec = "1"

[target.'cfg(all(feature = "tokio-uring", linux))'.dependencies]
tokio-uring = { version = "0.5", features = ["bytes"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
