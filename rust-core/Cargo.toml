[package]
name = "fearless-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
io-uring = ["dep:io-uring", "dep:core_affinity"]

# Turned on by `fearless build` when generated AOT handlers exist alongside
# `src/aot/handlers.rs`. Off by default so the binary builds cleanly with no
# user app (e.g. CI, benchmark images).
aot-handlers = []

# Phase 1.1: PostgreSQL connection pool support (Tasks 3-6).
# Pulls in tokio runtime + postgres driver only when this feature is enabled.
pg-handles = ["dep:tokio", "dep:tokio-postgres", "dep:deadpool-postgres", "dep:parking_lot"]

[dependencies]
arc-swap = "1.7"
fastrand = "2"
httpdate = "1"
itoa = "1"
libc = "0.2"
memchr = "2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
smallvec = "1"
slab = "0.4"
mimalloc = { version = "0.1", default-features = false }
core_affinity = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
parking_lot = { version = "0.12", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "microbench"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
