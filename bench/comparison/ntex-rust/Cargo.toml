[package]
name = "ntex-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Pinned to versions current as of 2026-05; mirrors TFB's published
# ntex+postgres setup so this comparison is apples-to-apples.
[dependencies]
ntex = { version = "2.10", features = ["tokio"] }
tokio = { version = "1.40", features = ["full"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
